    issue_assignment: false
    pr_review_requested: true
    pr_review_result: true
    pr_review_comment: false
    pr_merged: true
    pr_closed: true
    issue_reopened: true
    pr_reopened: true
    pr_opened: true
    pr_opened_github_comment: true
    coderabbit_reminders: false
    coderabbit_reminder_after_hours: 48
    channel_id: null
assignments:
