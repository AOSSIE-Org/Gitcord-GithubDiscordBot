# Example config for AOSSIE-Org (reference only — not used by docker-compose).
# Copy ideas into your own config/config.yaml; set GITHUB_TOKEN and DISCORD_TOKEN in .env.
# For Docker: cp config/docker-example.yaml config/config.yaml and keep data_dir: "/data".
#
# First sync after expanding repos? Use config/examples/aussie-first-sync.yaml once, then revert here.

runtime:
  mode: "active"
  log_level: "INFO"
  data_dir: "/data"
  github_adapter: "ghdcbot.adapters.github.rest:GitHubRestAdapter"
  discord_adapter: "ghdcbot.adapters.discord.api:DiscordApiAdapter"
  storage_adapter: "ghdcbot.adapters.storage.sqlite:SqliteStorage"
  activity_period_days: 7
  enable_discord_role_updates: false

github:
  org: "AOSSIE-Org"
  token: "${GITHUB_TOKEN}"
  api_base: "https://api.github.com"
  permissions:
    read: true
    write: true
  user_fallback: false
  # Repo allowlist: only these repositories are scanned (sync/run-once). Uses short repo names under the org (not "org/name").
  # Top 13 public AOSSIE repos by open issues + PRs (2026-07-03), plus Gitcord pilot repos (15 total).
  # Omit this block entirely to include all org repos (slower on large orgs). mode "deny" excludes listed names instead.
  repos:
    mode: allow
    names:
      - "Agora-Blockchain"
      - "BabyNest"
      - "DebateAI"
      - "Devr.AI"
      - "EduAid"
      - "Ell-ena"
      - "Gitcord-GithubDiscordBot"
      - "Gitcord-Test"
      - "InPactAI"
      - "NeuroTrack"
      - "Perspective"
      - "PictoPy"
      - "Rein"
      - "Resonate"
      - "Resonate-Website"

discord:
  guild_id: "1022871757289422898"
  token: "${DISCORD_TOKEN}"
  permissions:
    read: true
    write: true
  # TESTING: set false in production — when true, any server member may use /assign-issue, /issue-requests, /sync.
  unrestricted_slash_commands: false
  # Per-command slash access (role_ids stable; role_names optional). Admins may use these when enabled below.
  command_permissions:
    assign-issue:
      role_names: ["Mentor"]
      allow_discord_administrators: true
    issue-requests:
      role_names: ["Mentor"]
      allow_discord_administrators: true
    sync:
      role_names: ["Mentor"]
      allow_discord_administrators: true
  activity_channel_id: null
  pr_preview_channels: []
  # Verified GitHub → Discord DMs (or channel if channel_id is set). Requires linked users (/link + /verify-link).
  # Each notification type can be independently enabled/disabled to control notification volume.
  # Notification recipients are: assignee (issue_assignment), reviewer (pr_review_requested), author (pr_review_result, pr_review_comment, pr_merged, pr_closed, pr_reopened), assignee (issue_reopened).
  notifications:
    enabled: true                    # Master switch for all notifications
    issue_assignment: false          # Off: avoids DM flood from assignment events (use /assign-issue manually)
    pr_review_requested: true        # 👀 Reviewer requested on a PR
    pr_review_result: true           # ✅ PR approved or 🔁 changes requested
    pr_review_comment: true          # 💬 Comment posted on PR review
    pr_merged: true                  # 🎉 PR merged to main
    pr_closed: true                  # 🚫 PR closed without merge
    issue_reopened: true             # 📌 Issue reopened
    pr_reopened: true                # 🔄 PR reopened
    coderabbit_reminders: false
    coderabbit_reminder_after_hours: 48
    channel_id: null  # null = DM; set to a channel ID to post notifications there instead

assignments:
  review_roles: []
  # Do NOT list Mentor here for scheduled sync — run_once auto-assigns every open
  # unassigned issue in scanned repos to users with the Discord Mentor role.
  # Mentors assign via /assign-issue instead.
  issue_assignees: []
  issue_request_eligible_roles: []

repo_contributor_roles: {}
