# AOSSIE steady-state Gitcord config for Docker + sync-scheduler deployment.
# Copy to config/config.yaml for production:
#   cp config/aussie.yaml config/config.yaml
# Set GITHUB_TOKEN and DISCORD_TOKEN in .env.
#
# First sync after expanding repos? Use config/examples/aussie-first-sync.yaml once, then revert here.

runtime:
  mode: "active"
  log_level: "INFO"
  data_dir: "/data"
  github_adapter: "ghdcbot.adapters.github.rest:GitHubRestAdapter"
  discord_adapter: "ghdcbot.adapters.discord.api:DiscordApiAdapter"
  storage_adapter: "ghdcbot.adapters.storage.sqlite:SqliteStorage"
  activity_period_days: 7
  enable_discord_role_updates: false

github:
  org: "AOSSIE-Org"
  token: "${GITHUB_TOKEN}"
  api_base: "https://api.github.com"
  permissions:
    read: true
    write: true
  user_fallback: false
  # Repo allowlist: only these repositories are scanned (sync/run-once). Uses short repo names under the org (not "org/name").
  # Shared list: config/aussie-repos.yaml (19 AOSSIE repos).
  repos: !include aussie-repos.yaml

discord:
  guild_id: "1022871757289422898"
  token: "${DISCORD_TOKEN}"
  permissions:
    read: true
    write: true
  # TESTING: set false in production — when true, any server member may use /assign-issue, /issue-requests, /sync.
  unrestricted_slash_commands: false
  # Per-command slash access (role_ids stable; role_names optional). Admins may use these when enabled below.
  command_permissions:
    assign-issue:
      role_names: ["Mentor"]
      allow_discord_administrators: true
    issue-requests:
      role_names: ["Mentor"]
      allow_discord_administrators: true
    sync:
      role_names: ["Mentor"]
      allow_discord_administrators: true
  activity_channel_id: null
  pr_preview_channels: []
  pr_open_channels:
    # #projects forum threads — repo short name → thread ID.
    # Posts for all PR opens in mapped repos; verified authors are @mentioned,
    # unverified authors show "Contributor is not verified on gitcord".
    Agora-Blockchain: "1331983948175380581"       # Agora Blockchain
    BabyNest: "1339225155481763882"              # BabyNest
    DebateAI: "1312986807914463252"              # AI for Debates
    Devr.AI: "1345044976794472498"               # Devr.AI
    EduAid: "1317912993786499072"                # EduAid
    Ell-ena: "1349032611267477586"               # Ell-ena
    Gitcord-GithubDiscordBot: "1465995983791063140"  # Gitcord - Github Discord Bot
    Gitcord-Test: "1524006041677729823"          # gitcord testing
    InPactAI: "1345044736515379210"              # InPact AI
    NeuroTrack: "1347053043711082507"           # NeuroTrack
    Perspective: "1339226574276268144"           # Perspective AI
    PictoPy: "1311271974630330388"               # Pictopy
    Rein: "1467370739152846899"                  # Rein
    Resonate: "1317913663360864346"              # Resonate
    Resonate-Website: "1317913663360864346"       # Resonate (shared project thread)
    # No #projects thread yet: PullRequestDashboard, SkillBot, Skills, Template-Repo
  notifications:
    enabled: true
    issue_assignment: false          # Off: avoids DM flood from assignment events (use /assign-issue manually)
    pr_review_requested: true
    pr_review_result: true
    pr_review_comment: true
    pr_merged: true
    pr_closed: true
    issue_reopened: true
    pr_reopened: true
    pr_opened: true
    coderabbit_reminders: false
    coderabbit_reminder_after_hours: 48
    channel_id: null

assignments:
  review_roles: []
  # Do NOT list Mentor here for scheduled sync — run_once auto-assigns every open
  # unassigned issue in scanned repos. Mentors assign via /assign-issue instead.
  issue_assignees: []
  issue_request_eligible_roles: []

repo_contributor_roles: {}
